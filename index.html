<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Song-Studio</title>
<style>
  :root {
    --bg: #f4f1fb;
    --card: #ffffff;
    --ink: #1f1a2e;
    --muted: #6b6480;
    --accent: #6d3df5;
    --accent-ink: #ffffff;
    --accent-soft: #ece5ff;
    --me: #6d3df5;
    --me-ink: #ffffff;
    --border: #e2dcf0;
    --error: #c62848;
    --error-soft: #fde8ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15121f;
      --card: #211c30;
      --ink: #f1edfb;
      --muted: #a79fbf;
      --accent: #8f6bff;
      --accent-soft: #2e2546;
      --me: #7650f0;
      --border: #352d4a;
      --error: #ff7a93;
      --error-soft: #3a1d26;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }
  button { font: inherit; cursor: pointer; }
  .hidden { display: none !important; }

  /* ---------- Anmeldung ---------- */
  #login {
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .login-card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px 24px;
    text-align: center;
  }
  .logo { font-size: 48px; line-height: 1; }
  .login-card h1 { margin: 12px 0 4px; font-size: 26px; }
  .login-card p { margin: 0 0 24px; color: var(--muted); }
  .login-card input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
    margin-bottom: 12px;
  }
  .btn {
    border: 0;
    border-radius: 12px;
    padding: 12px 18px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-wide { width: 100%; }
  .btn-ghost {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
    padding: 8px 12px;
    font-weight: 600;
    border-radius: 10px;
  }
  .err { color: var(--error); min-height: 24px; margin-top: 8px; font-size: 14px; }

  /* ---------- Chat ---------- */
  #app { height: 100%; display: flex; flex-direction: column; }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
  }
  header .title { font-weight: 700; font-size: 18px; flex: 1; }
  .counter { color: var(--muted); font-size: 14px; white-space: nowrap; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg {
    max-width: 88%;
    padding: 12px 14px;
    border-radius: 16px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .msg.me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.error { background: var(--error-soft); border-color: var(--error); color: var(--ink); }
  .msg.bot audio { width: 100%; min-width: 240px; margin: 8px 0 4px; display: block; }
  .msg.bot .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .msg.bot a.dl {
    display: inline-block;
    text-decoration: none;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
  }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; }
  details pre {
    white-space: pre-wrap;
    font-family: inherit;
    font-size: 14px;
    background: var(--bg);
    padding: 10px;
    border-radius: 10px;
    margin: 8px 0 0;
  }
  .divider {
    align-self: center;
    font-size: 13px;
    color: var(--muted);
    background: var(--accent-soft);
    padding: 4px 12px;
    border-radius: 999px;
  }
  .dots::after { content: ""; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  .msg.welcome { white-space: normal; }
  .welcome h2 { margin: 0 0 6px; font-size: 20px; }
  .welcome p { margin: 0 0 10px; color: var(--muted); white-space: normal; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--ink);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 14px;
    text-align: left;
  }

  footer {
    background: var(--card);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
  }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea {
    flex: 1;
    resize: none;
    min-height: 48px;
    max-height: 200px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--bg);
    color: var(--ink);
    font: inherit;
  }
  .mode { max-width: 760px; margin: 0 auto 8px; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
</style>
</head>
<body>

<!-- Anmeldung -->
<section id="login">
  <form class="login-card" id="loginForm">
    <div class="logo">🎵</div>
    <h1>Song-Studio</h1>
    <p>Schreib, was für einen Song du willst – die KI komponiert ihn.</p>
    <input type="password" id="pw" placeholder="Passwort" autocomplete="current-password" required>
    <button class="btn btn-wide" id="loginBtn" type="submit">Anmelden</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- Chat -->
<section id="app" class="hidden">
  <header>
    <span class="title">🎵 Song-Studio</span>
    <span class="counter" id="counter"></span>
    <button class="btn-ghost" id="logoutBtn" type="button">Abmelden</button>
  </header>

  <main id="chat"><div class="inner" id="msgs"></div></main>

  <footer>
    <div class="mode">
      <span id="modeText">Neuer Song</span>
      <button class="btn-ghost hidden" id="newBtn" type="button">＋ Neuer Song</button>
    </div>
    <form class="composer" id="sendForm">
      <textarea id="input" rows="1" placeholder="Beschreibe deinen Song oder füge deinen Songtext ein …"></textarea>
      <button class="btn" id="sendBtn" type="submit">Senden</button>
    </form>
  </footer>
</section>

<script>
  // ---------- Einstellungen ----------
  // Adresse des Servers bei Google Cloud Run (wird beim Einrichten eingetragen).
  const SERVER_URL = "https://song-generator-324508483100.europe-west3.run.app";
  const API = location.hostname === "localhost" ? "http://localhost:8787" : SERVER_URL;

  const $ = (id) => document.getElementById(id);
  let token = load("token");
  let current = null; // { prompt, lyrics } des letzten Songs – Grundlage für Änderungen
  let busy = false;
  let songNo = 0;

  function load(k) { try { return sessionStorage.getItem(k); } catch { return null; } }
  function save(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} }

  async function api(path, body) {
    const res = await fetch(API + path, {
      method: body ? "POST" : "GET",
      headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({ error: "Keine Antwort vom Server." }));
    if (res.status === 401 && path !== "/login") { logout(); throw new Error("Bitte neu anmelden."); }
    if (!res.ok) throw new Error(data.error || "Fehler " + res.status);
    return data;
  }

  // ---------- Anmeldung ----------
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("loginErr").textContent = "";
    $("loginBtn").disabled = true;
    try {
      const data = await api("/login", { password: $("pw").value });
      token = data.token;
      save("token", token);
      showApp(data.left);
    } catch (err) {
      $("loginErr").textContent = err.message === "Failed to fetch" ? "Server nicht erreichbar." : err.message;
    } finally {
      $("loginBtn").disabled = false;
    }
  });

  function showApp(left) {
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("pw").value = "";
    setCounter(left);
    if (!$("msgs").children.length) welcome();
    $("input").focus();
  }

  function logout() {
    token = null;
    save("token", null);
    $("app").classList.add("hidden");
    $("login").classList.remove("hidden");
  }
  $("logoutBtn").addEventListener("click", logout);

  function setCounter(left) {
    if (typeof left === "number") $("counter").textContent = `Noch ${left} Songs heute`;
  }

  // ---------- Chat ----------
  function add(cls, text) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    if (text != null) el.textContent = text;
    $("msgs").appendChild(el);
    $("chat").scrollTop = $("chat").scrollHeight;
    return el;
  }

  function welcome() {
    const el = add("bot welcome");
    el.innerHTML = `<h2>Hey! 👋 Lass uns einen Song machen.</h2>
      <p>Beschreib Stil, Stimmung und Thema – oder füg deinen eigenen Songtext ein
      (mit <b>[Strophe]</b>, <b>[Refrain]</b>, <b>[Bridge]</b>).
      Danach kannst du Änderungen wünschen, z. B. „schneller“ oder „mit Frauenstimme“.</p>
      <div class="chips"></div>`;
    const ideas = [
      "Ein fröhlicher Pop-Song über den letzten Schultag, deutsche Lyrics, Frauenstimme",
      "Deutschrap über Montagmorgen, harter Beat, 90 BPM",
      "Chilliger Lo-Fi-Beat zum Lernen, ohne Gesang",
      "Rocksong über Freundschaft, E-Gitarren, Refrain zum Mitsingen",
    ];
    const box = el.querySelector(".chips");
    for (const idea of ideas) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = idea;
      b.onclick = () => { $("input").value = idea; autosize(); $("input").focus(); };
      box.appendChild(b);
    }
  }

  function setMode() {
    $("modeText").textContent = current ? "✏️ Änderungsmodus: Deine Nachricht ändert den letzten Song" : "Neuer Song";
    $("newBtn").classList.toggle("hidden", !current);
    $("input").placeholder = current
      ? "Was soll anders werden? z. B. „Refrain fröhlicher“, „schneller“ …"
      : "Beschreibe deinen Song oder füge deinen Songtext ein …";
  }

  $("newBtn").addEventListener("click", () => {
    current = null;
    setMode();
    const d = document.createElement("div");
    d.className = "divider";
    d.textContent = "Neuer Song";
    $("msgs").appendChild(d);
    $("input").focus();
  });

  $("sendForm").addEventListener("submit", (e) => { e.preventDefault(); send(); });
  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $("input").addEventListener("input", autosize);
  function autosize() {
    const t = $("input");
    t.style.height = "auto";
    t.style.height = Math.min(t.scrollHeight, 200) + "px";
  }

  async function send() {
    const text = $("input").value.trim();
    if (!text || busy) return;
    busy = true;
    $("sendBtn").disabled = true;
    $("input").value = "";
    autosize();
    add("me", text);

    const wait = add("bot");
    const start = Date.now();
    const label = current ? "Ich baue deine Änderungen ein" : "Dein Song wird komponiert";
    const tick = () => {
      const s = Math.round((Date.now() - start) / 1000);
      wait.innerHTML = `🎼 ${label}<span class="dots"></span><br><small style="color:var(--muted)">${s} s – dauert meist 30 bis 90 Sekunden</small>`;
    };
    tick();
    const timer = setInterval(tick, 1000);

    try {
      const data = await api("/song", { message: text, previous: current });
      clearInterval(timer);
      wait.remove();
      showSong(data, !!current);
      current = { prompt: data.prompt, lyrics: data.lyrics || "" };
      setMode();
      setCounter(data.left);
    } catch (err) {
      clearInterval(timer);
      wait.classList.add("error");
      wait.textContent = "⚠️ " + (err.message === "Failed to fetch" ? "Server nicht erreichbar. Prüf deine Internetverbindung." : err.message);
    } finally {
      busy = false;
      $("sendBtn").disabled = false;
      $("input").focus();
    }
  }

  function showSong(data, changed) {
    songNo++;
    const bytes = Uint8Array.from(atob(data.audio), (c) => c.charCodeAt(0));
    const blob = new Blob([bytes], { type: data.mime });
    const url = URL.createObjectURL(blob);
    const ext = data.mime.includes("wav") ? "wav" : "mp3";

    const el = add("bot");
    const head = document.createElement("div");
    head.textContent = changed ? `🎶 Hier ist Version ${songNo} mit deinen Änderungen:` : `🎶 Hier ist dein Song (Nr. ${songNo}):`;
    el.appendChild(head);

    const audio = document.createElement("audio");
    audio.controls = true;
    audio.src = url;
    el.appendChild(audio);

    const row = document.createElement("div");
    row.className = "row";
    const a = document.createElement("a");
    a.className = "dl";
    a.href = url;
    a.download = `song-${songNo}.${ext}`;
    a.textContent = "⬇ Herunterladen";
    row.appendChild(a);
    el.appendChild(row);

    if (data.lyrics) {
      const det = document.createElement("details");
      const sum = document.createElement("summary");
      sum.textContent = "Songtext & Aufbau anzeigen";
      const pre = document.createElement("pre");
      pre.textContent = data.lyrics;
      det.append(sum, pre);
      el.appendChild(det);
    }

    const hint = document.createElement("div");
    hint.style.cssText = "margin-top:8px;font-size:14px;color:var(--muted)";
    hint.textContent = "Gefällt dir was nicht? Schreib einfach, was anders werden soll.";
    el.appendChild(hint);
    $("chat").scrollTop = $("chat").scrollHeight;
  }

  // ---------- Start ----------
  if (token) {
    api("/status").then((d) => showApp(d.left)).catch(() => logout());
  }
</script>
</body>
</html>
